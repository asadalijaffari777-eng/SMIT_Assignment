<!DOCTYPE html>
<html lang="en">
<head>

</head>
<body>
    <center><h1>Complex Table</h1></center>

    <table border="2px">
        <tr>
            <th colspan="2">invoice #123456789</th>
            <th colspan="2">14 January 2025</th>
        </tr>

        <tr>
            <td colspan="2">
                Pay to: <br>
                Acme Villing Co. <br>
                123 Main St. <br>
                Cityvilla
            </td>
            <td colspan="2">
                Customer: <br>
                John Smith <br>
                321 Willow Way
            </td>
        </tr>

        <tr>
            <th>Name/Descriptive</th>
            <th>Qty.</th>
            <th>a</th>
            <th>Cost</th>
        </tr>

        <tr>
            <td>Paperclips</td>
            <td>1000</td>
            <td>0.01</td>
            <td>10.00</td>
        </tr>

        <tr>
            <td>Staples (box)</td>
            <td>100</td>
            <td>1.00</td>
            <td>100.00</td>
        </tr>

        <tr>
            <td colspan="3">Subtotal</td>
            <td>110.00</td>
        </tr>

        <tr>
            <td colspan="2">Tax</td>
            <td>8%</td>
            <td>8.80</td>
        </tr>

        <tr>
            <td colspan="2">Grand Total</td>
            <td colspan="2">$118.80</td>
        </tr>
    </table>

</html>
