<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ph Scale</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="title-div">
        <h1>pH Scale</h1>
    </div>

    <main>
        <p class="alkaline-one">14.0 VERY ALKALINE</p>
        <p class="alkaline-two">13.0</p>
        <p class="alkaline-three">12.0</p>
        <p class="alkaline-four">11.0</p>
        <p class="alkaline-five">10.0</p>
        <p class="alkaline-six">9.0</p>
        <p class="alkaline-seven">8.0</p>

        <p class="netural">7.0 NEUTRAL</p>

        <p class="acid-one">6.0</p>
        <p class="acid-two">5.0</p>
        <p class="acid-three">4.0</p>
        <p class="acid-four">3.O</p>
        <p class="acid-five">2.0</p>
        <p class="acid-six">1.O</p>
        <p class="acid-seven">0.0 VERY ACID</p>
    </main>
</body>
</html>
